<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PixelCloud | Serverless Image Processing</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="#">PixelCloud</a><span>HTML · CSS · JAVASCRIPT PROJECT</span></header><main>
<section class="hero"><p class="eyebrow">BROWSER CANVAS WORKFLOW</p><h1>Transform images in seconds.</h1><p>Choose an image, apply an effect and export the result. Processing runs locally in your browser.</p></section>
<section class="panel"><div class="grid"><label>Choose image<input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Effect<select id="effect"><option value="grayscale">Grayscale</option><option value="sepia">Sepia</option><option value="brightness">Brightness</option><option value="blur">Blur</option></select></label><label>Intensity <output id="val">100%</output><input id="intensity" type="range" min="0" max="200" value="100"></label></div><div class="row"><button id="process" disabled>Process image</button><button id="download" disabled>Download PNG</button></div><p id="message" class="muted">No image selected.</p></section>
<section class="grid"><article class="panel"><h3>Original</h3><canvas id="original"></canvas></article><article class="panel"><h3>Processed</h3><canvas id="result"></canvas></article></section></main><footer>PixelCloud · Educational project prototype</footer><script src="app.js"></script></body></html>
